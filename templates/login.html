<!DOCTYPE html>

<html lang="en">

<head>

    <title>Login to Queues</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="card" style="max-width: 400px; margin: 50px auto;">
        <h1>Welcome!</h1>
        
        {% if error %}

            <p style="color: #ef4444; font-weight: bold; text-align: center; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 5px;">{{ error }}</p>

        {% endif %}



        <form method="POST">

            <label>Username</label>

            <input type="text" name="username" required>

            <label>Password</label>
            <div style="position: relative;">
                <input type="password" name="password" id="password" required style="width: 100%; padding-right: 40px;">
                <span onclick="togglePassword('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none;">👁️</span>
            </div>

           

            <button type="submit" style="width: 100%; margin-top: 15px;">Sign In</button>

        </form>

        <p style="text-align: center; margin-top: 15px;">

            Don't have an account? <a href="/register" style="color: #2563eb;">Register here</a>

        </p>

    </div>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }
    </script>
</body>

</html>
