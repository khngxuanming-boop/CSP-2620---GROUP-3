<!DOCTYPE html>

<html lang="en">

<head>

    <title>Login to Queues</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="card" style="max-width: 400px; margin: 50px auto;">

        <h1>Welcome Back!</h1>

       

        {% if error %}

            <p style="color: #ef4444; font-weight: bold; text-align: center; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 5px;">{{ error }}</p>

        {% endif %}



        <form method="POST">

            <label>Username</label>

            <input type="text" name="username" required>

           

            <label>Password</label>
            <div style="position: relative;">
                <input type="password" name="password" id="password" required style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                <span onclick="togglePassword('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; display: flex; align-items: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>

           

            <button type="submit" style="width: 100%; margin-top: 15px;">Sign In</button>

        </form>

        <p style="text-align: center; margin-top: 15px;">

            Don't have an account? <a href="/register" style="color: #2563eb;">Register here</a>

        </p>
        <p style="text-align: center; margin-top: 5px;">
            <a href="/forgot_password" style="color: #2563eb;">Forgot password?</a>
        </p>
    </div>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';

            icon.innerHTML = isHidden
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        }
    </script>
</body>

</html>
