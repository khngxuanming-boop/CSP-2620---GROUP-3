<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card" style="max-width: 400px; margin: 50px auto;">
        <h1>Forgot Password</h1>
        <p style="color: #6b7280; margin-top: -10px;">Enter your email and we'll send you a reset link.</p>

        {% if message %}
            <p style="color: #059669; font-weight: bold; text-align: center; background: rgba(16, 185, 129, 0.1); padding: 10px; border-radius: 5px;">
                {{ message }}
            </p>
        {% endif %}

        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" required style="width: 100%; box-sizing: border-box; margin-bottom: 15px;">

            <button type="submit" style="width: 100%;">Send Reset Link</button>
        </form>

        <p style="text-align: center; margin-top: 15px;">
            <a href="/login" style="color: #2563eb;">Back to login</a>
        </p>
    </div>
</body>
</html>
