<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card" style="max-width: 400px; margin: 50px auto;">
        <h1>Forgot Password</h1>

        {% if message %}
            <p style="color: #10b981; text-align: center;">{{ message }}</p>
        {% endif %}

        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" required style="width: 100%; box-sizing: border-box;">

            <button type="submit" style="width: 100%; margin-top: 15px;">Send Reset Link</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            <a href="/login" style="color: #2563eb;">Back to login</a>
        </p>
    </div>
</body>
</html>
