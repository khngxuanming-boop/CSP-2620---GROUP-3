<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-In Page - Queues Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <h2 class="text-center mb-4">Welcome to Apple Store</h2>
      <div class="row justify-content-center gap-4">
        <div
          class="col-md-5 card text-center shadow-sm p-4 action-card border-primary"
          id="walkInBtn"
        >
          <div class="card-body">
            <h1 class="display-4 text-primary mb-3">🚶</h1>
            <h3 class="card-title mb-3">Walk-In</h3>
            <p class="text-muted">
              No need to book an appointment. Join the queue directly.
            </p>
            <button class="btn btn-outline-primary mt-2">
              Click to get your queue number
            </button>
          </div>
        </div>
        <div
          class="col-md-5 card text-center shadow-sm p-4 action-card border-success"
          id="checkInBtn"
        >
          <div class="card-body">
            <h1 class="display-4 text-success mb-3">📅</h1>
            <h3 class="card-title mb-3">Check-In</h3>
            <p class="text-muted">
              Already have an appointment? Check in here to activate it.
            </p>
            <button class="btn btn-outline-success mt-2">
              Click to check in
            </button>
          </div>
        </div>
      </div>
    </div>

    <input
      type="hidden"
      id="currentUserId"
      value="{{ session.get('user_id') }}"
    />

    <script src="../static/js/check_in.js"></script>
  </body>
</html>
