<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register to Queues</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card" style="max-width: 400px; margin: 50px auto;">
        <h1>Create Account</h1>
        
        {% if error %}
            <p style="color: #ef4444; font-weight: bold; text-align: center; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 5px;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required style="width: 100%; box-sizing: border-box;">

            <label>Password</label>
            <div style="position: relative;">
                <input type="password" name="password" id="password" required style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                <span onclick="togglePassword('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-75%); cursor: pointer; user-select: none; display: flex; align-items: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>

            <label>Account Type</label>
            
            <select name="role" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #d1d5db;">
                <option value="CUSTOMER">Customer</option>
                <option value="STAFF">Store Administrator / Staff</option>
            </select>
            
            <button type="submit" style="width: 100%;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Already have an account? <a href="/" style="color: #2563eb;">Login here</a>
        </p>
    </div>

</body>
</html>
