<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Page - Queues Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>
  <body class="bg-light">
    <input
      type="hidden"
      id="currentUserId"
      value="{{ session.get('user_id') }}"
    />

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
              <h4>Appointment Page</h4>
            </div>
            <div class="card-body">
              <form id="bookingForm">
                <div class="mb-3">
                  <label for="storeService" class="form-label"
                    >Selected Service</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="storeService"
                    value="Service Selected"
                    disabled
                  />
                </div>
                <div class="mb-3">
                  <label for="apptDate" class="form-label">Select Date</label>
                  <input
                    type="date"
                    class="form-control"
                    id="apptDate"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="apptTime" class="form-label"
                    >Select Time Slot</label
                  >
                  <select class="form-select" id="apptTime" required>
                    <option value="">Please select a time...</option>
                    <option value="08:00">08:00 - 09:00</option>
                    <option value="09:00">09:00 - 10:00</option>
                    <option value="10:00">10:00 - 11:00</option>
                    <option value="11:00">11:00 - 12:00</option>
                    <option value="13:00">13:00 - 14:00</option>
                    <option value="14:00">14:00 - 15:00</option>
                    <option value="15:00">15:00 - 16:00</option>
                    <option value="16:00">16:00 - 17:00</option>
                    <option value="17:00">17:00 - 18:00</option>
                    <option value="18:00">18:00 - 19:00</option>
                    <option value="19:00">19:00 - 20:00</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Confirm Appointment
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../static/js/booking.js"></script>
  </body>
</html>
