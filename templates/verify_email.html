<!DOCTYPE html>
<html lang="en">
<head>
    <title>Verify Your Email</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card" style="max-width: 400px; margin: 50px auto;">
        <h1>Verify Your Email</h1>
        <p>We sent a 6-digit code to your email for <strong>{{ username }}</strong>.</p>

        {% if error %}
            <p style="color: #ef4444;">{{ error }}</p>
        {% endif %}
        {% if notice %}
            <p style="color: #22c55e;">{{ notice }}</p>
        {% endif %}

        <form method="POST">
            <label>Verification Code</label>
            <input type="text" name="code" maxlength="6" required style="width: 100%; box-sizing: border-box;">
            <button type="submit" style="width: 100%; margin-top: 15px;">Verify</button>
        </form>

        <form method="POST" action="{{ url_for('resend_code') }}" style="margin-top: 10px;">
            <button type="submit" style="width: 100%; background: transparent; border: 1px solid #999;">Resend code</button>
        </form>
    </div>
</body>
</html>
