<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Queues Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body text-center p-5">
          <h5 class="text-muted mb-3">Your Queue Number</h5>
          <h1 class="display-1 fw-bold text-primary mb-0">Q-015</h1>
          <span
            class="badge bg-warning text-dark fs-5 mt-3 mb-4"
            id="queueStatus"
            >WAITING</span
          >
          <div class="row mt-4">
            <div class="col-6 border-end">
              <h4 class="text-muted">People Ahead</h4>
              <h2 class="fw-bold" id="peopleAhead">4</h2>
              <p class="mb-0">people</p>
            </div>
            <div class="col-6">
              <h4 class="text-muted">Estimated Wait Time</h4>
              <h2 class="fw-bold" id="waitTime">20</h2>
              <p class="mb-0">minutes</p>
            </div>
          </div>

          <hr class="my-4" />
          <button
            class="btn btn-outline-danger btn-lg px-5"
            id="cancelQueueBtn"
          >
            Cancel Queue
          </button>
        </div>
      </div>
    </div>
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
      <div
        id="alertToast"
        class="toast align-items-center text-white bg-info border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body fs-6" id="toastMessage"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/dashboard.js"></script>
  </body>
</html>
